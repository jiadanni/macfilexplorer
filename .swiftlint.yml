# SwiftLint configuration for MacFileExplorer.
# Run from the repository root: swiftlint lint

included:
  - MacFileExplorer/Sources
  - MacFileExplorerTests

excluded:
  - build
  - DerivedData
  - Carthage
  - Pods

opt_in_rules:
  - empty_count
  - trailing_comma

disabled_rules:
  - line_length
  - trailing_whitespace

# Custom rules must live under `custom_rules`.
custom_rules:
  no_force_cast:
    name: "No Force Cast"
    regex: '\bas!\s'
    message: "Avoid force casting, use conditional casts instead."
    severity: warning
